<div class="modal" data-consult-modal aria-hidden="true" role="dialog" aria-labelledby="consult-title">
  <div class="modal__panel">
    <h2 id="consult-title">درخواست مشاوره</h2>
    <form class="form" data-consult-form>
      <input type="text" name="website" tabindex="-1" autocomplete="off" hidden />
      <label>
        نام و نام خانوادگی
        <input name="name" required maxlength="80" />
      </label>
      <label>
        شماره تماس
        <input name="phone" required inputmode="tel" maxlength="15" />
      </label>
      <label>
        موضوع مشاوره
        <input name="subject" required maxlength="120" />
      </label>
      <label>
        شرح کوتاه درخواست
        <textarea name="description" required maxlength="1000"></textarea>
      </label>
      <p data-form-error></p>
      <button class="btn" type="submit"><svg class="icon"><use href="#i-check"/></svg>ارسال درخواست</button>
      <button class="btn btn--ghost" type="button" data-close-modal>بستن</button>
    </form>
    <div class="confirm-card" data-consult-confirm></div>
  </div>
</div>
